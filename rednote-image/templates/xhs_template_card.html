<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

    * { box-sizing: border-box; }
    html, body {
      width: 1080px !important;
      height: 1440px !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: 'Noto Sans SC', 'DejaVu Sans', 'Liberation Sans', 'WenQuanYi Micro Hei', 'Microsoft YaHei', sans-serif !important;
      background: transparent;
    }
    body { overflow: hidden; }
    .container {
      width: 1080px !important;
      height: 1440px !important;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .content-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 60px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.05);
      padding: 56px 44px;
    }
    .main-title {
      font-size: 6.0rem;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0 0 48px 0;
      line-height: 1.08;
      letter-spacing: -4px;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.08);
    }
    .subtitle {
      font-size: 3.1rem;
      font-weight: 500;
      color: #1a1a1a;
      margin: 0 0 48px 0;
      line-height: 1.35;
      position: relative;
      z-index: 1;
    }
    .subtitle-red {
      font-size: 2.9rem;
      font-weight: 700;
      color: #ff2e4d;
      margin: 0 0 48px 0;
      line-height: 1.35;
      position: relative;
      z-index: 1;
    }
    .highlight {
      background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 100%);
      color: #1e293b;
      padding: 16px 36px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 2.9rem;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.35);
      display: inline-block;
      transform: rotate(-2deg);
      margin: 16px 0 32px;
    }
    .icon-container {
      margin-bottom: 44px;
      position: relative;
      z-index: 1;
    }
    .icon-wrapper {
      width: 320px;
      height: 320px;
      background: #ffffff;
      border-radius: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.12), 0 6px 12px rgba(0,0,0,0.08);
      margin: 0 auto;
    }
    .icon-image {
      width: 220px;
      height: 220px;
      object-fit: contain;
    }
    .slogan {
      font-size: 2.9rem;
      font-weight: 500;
      color: #1e293b;
      margin: 0;
      position: relative;
      z-index: 1;
      line-height: 1.35;
    }
    .strong {
      color: #ff2e4d;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content-card">
      <h1 class="main-title">{{main-title}}</h1>
      <div class="icon-container">
        <div class="icon-wrapper">
          <img src="{{image}}" class="icon-image" />
        </div>
      </div>
      <p class="subtitle">{{subtitle}}</p>
      <div class="highlight">{{highlight}}</div>
      <p class="slogan">{{slogan}}</p>
      <p class="subtitle-red">{{subtitle-red}}</p>
    </div>
  </div>
</body>
</html>
