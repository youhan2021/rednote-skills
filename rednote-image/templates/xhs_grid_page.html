<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
/*
  Unified XHS grid content page — 1080x1440
  Placeholders: {{emoji}} {{title}} {{subtitle}} {{sections_html}} {{bar_text}}
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1440px; font-family: 'Noto Sans SC', sans-serif; overflow: hidden; }
body { background: #f8fafc; display: flex; flex-direction: column; }
.ph { background: linear-gradient(135deg,#5b21b6,#7c3aed); padding: 28px 48px; display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
.ph-e { font-size: 60px; }
.ph-t { font-size: 68px; font-weight: 900; color: white; }
.ph-s { font-size: 30px; color: #ddd6fe; font-weight: 500; margin-left: auto; text-align: right; }
.content { flex: 1; padding: 14px 48px; display: flex; flex-direction: column; gap: 12px; }
.sl { font-size: 38px; font-weight: 900; letter-spacing: 3px; margin-bottom: 4px; }
.sl1 { color: #f59e0b; } .sl2 { color: #60a5fa; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: white; border-radius: 24px; padding: 20px 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.ct { font-size: 52px; font-weight: 900; color: #5b21b6; margin-bottom: 8px; }
.cd { font-size: 36px; color: #6b7280; line-height: 1.6; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag { background: #ffedd5; color: #9a3412; padding: 6px 16px; border-radius: 999px; font-size: 30px; font-weight: 700; }
.tag2 { background: #dbeafe; color: #1e40af; }
.tag-purple { background: #ede9fe; color: #5b21b6; }
.tag-yellow { background: #fef3c7; color: #92400e; }
.tag-green { background: #d1fae5; color: #065f46; }
.tag-pink { background: #fce7f3; color: #9d174d; }
.cta { background: linear-gradient(90deg,#f59e0b,#f97316); border-radius: 24px; padding: 20px 28px; display: flex; align-items: center; justify-content: center; gap: 20px; }
.cta-t { color: white; font-size: 46px; font-weight: 900; }
.cta-s { color: rgba(255,255,255,0.88); font-size: 34px; }
.bar { background: linear-gradient(90deg,#5b21b6,#7c3aed); margin: 0 48px 24px; border-radius: 24px; padding: 20px 28px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.bar-text { color: white; font-size: 38px; font-weight: 700; }
</style></head><body>
<div class="ph">
  <div class="ph-e">{{emoji}}</div>
  <div class="ph-t">{{title}}</div>
  <div class="ph-s">{{subtitle}}</div>
</div>
<div class="content">
{{sections_html}}
</div>
<div class="bar"><div class="bar-text">💡 {{bar_text}}</div></div>
</body></html>
